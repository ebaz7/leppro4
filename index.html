            var isUltraCompactPda = isTouchLike && ((w > 0 && w <= 335) || (h > 0 && h <= 540));
            document.documentElement.classList.toggle('screen-compact-pda', isCompactPda);
            document.documentElement.classList.toggle('screen-ultra-compact-pda', isUltraCompactPda);
          } catch (e) {}
        };
        syncViewport();
        window.addEventListener('resize', syncViewport, { passive: true });
        window.addEventListener('orientationchange', function() {
          setTimeout(syncViewport, 80);
          setTimeout(syncViewport, 280);
        }, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
        }
        document.addEventListener('DOMContentLoaded', syncViewport);
      })();
    </script>

    <div id="root">
      <div id="boot-loader-fallback" style="min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:var(--system-font-stack);background:#f8fafc;color:#0f172a;direction:rtl;">
        <div style="width:44px;height:44px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:9999px;margin-bottom:14px;animation:bootSpin 0.9s linear infinite;"></div>
        <div id="boot-loader-title" style="font-size:15px;font-weight:800;margin-bottom:6px;">در حال بارگذاری سامانه دلکام...</div>
        <div id="boot-loader-sub" style="font-size:12px;color:#64748b;max-width:340px;line-height:1.7;">لطفاً چند لحظه شکیبا باشید.</div>
        <button id="boot-reset-btn" type="button" onclick="window.__hardResetAppCache && window.__hardResetAppCache()" style="display:none;margin-top:16px;padding:10px 18px;border:none;border-radius:12px;background:#2563eb;color:#ffffff;font-size:13px;font-weight:800;cursor:pointer;">پاکسازی کش و بارگذاری مجدد</button>
      </div>
      <style>@keyframes bootSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      window.__hardResetAppCache = function() {
        var didReload = false;
        var finishReload = function() {
          if (didReload) return;
          didReload = true;
          window.location.replace(window.location.pathname + '?_refresh=' + Date.now() + (window.location.hash || ''));
        };
        setTimeout(finishReload, 1500);
        try {
          sessionStorage.removeItem('chunk_reload_attempted');
          var tasks = [];
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {}));
          }
          if ('caches' in window) {
            tasks.push(caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).catch(function() {}));
          }
          if (tasks.length > 0) {
            Promise.all(tasks).finally(finishReload);
            return;
          }
        } catch (e) {}
        finishReload();
      };

      (function() {
        var showBootRecovery = function(reason) {
          if (window.__APP_MOUNTED__) return;
          var titleEl = document.getElementById('boot-loader-title');
          var subEl = document.getElementById('boot-loader-sub');
          var btnEl = document.getElementById('boot-reset-btn');
          if (titleEl) titleEl.textContent = 'خطا یا تاخیر در بارگذاری اولیه سامانه';
          if (subEl) subEl.textContent = reason || 'در صورت استفاده از نسخه قدیمی کش مرورگر، دکمه زیر را لمس کنید تا کش پاکسازی و برنامه مجدداً بارگذاری شود.';
          if (btnEl) btnEl.style.display = 'inline-block';
        };
        window.addEventListener('error', function(ev) {
          if (!window.__APP_MOUNTED__) {
            var msg = (ev && ev.message) ? String(ev.message) : '';
            if (msg) showBootRecovery('جزئیات خطا: ' + msg);
          }
        });
        window.addEventListener('unhandledrejection', function(ev) {
          if (!window.__APP_MOUNTED__) {
            var msg = (ev && ev.reason && (ev.reason.message || ev.reason)) ? String(ev.reason.message || ev.reason) : '';
            if (msg) showBootRecovery('جزئیات خطا: ' + msg);
          }
        });
        setTimeout(function() {
          if (!window.__APP_MOUNTED__) {
            showBootRecovery('بارگذاری بیش از حد طول کشید. ممکن است کش مرورگر قدیمی باشد یا ارتباط با سرور برقرار نشود.');
          }
        }, 14000);
      })();
    </script>

    <script>
      // Clean temporary cache-buster query params (_update or v) from address bar
      try {
        if (window.location.search && (window.location.search.indexOf('_update=') !== -1 || window.location.search.indexOf('v=') !== -1 || window.location.search.indexOf('_refresh=') !== -1)) {
          var params = new URLSearchParams(window.location.search);
          params.delete('_update');
          params.delete('v');
          params.delete('_refresh');
          var newSearch = params.toString();
          var cleanPath = window.location.pathname === '/chat' ? '/' : window.location.pathname;
          var cleanUrl = cleanPath + (newSearch ? '?' + newSearch : '') + (window.location.hash || '');
          window.history.replaceState(window.history.state, '', cleanUrl);
        }
      } catch (e) {}

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Purge any legacy caches (< v11) that might have cached non-HTML responses or ES2020 chunks
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                if (name.indexOf('finance-app-') === 0 && name !== 'finance-app-v11') {
                  caches.delete(name).catch(function() {});
                }
              });
            }).catch(function() {});
          }

          navigator.serviceWorker.register('/sw.js?v=11', { updateViaCache: 'none' })
            .then(function(reg) {
              console.log('SW Registered!', reg.scope);
              try { reg.update(); } catch (e) {}
            })
            .catch(function(err) { console.log('SW Registration ignored or failed:', err); });
        });
      }
    </script>
